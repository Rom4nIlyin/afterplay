name: Portable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v
        required: true
        default: '1.14.0'
  push:
    branches: ['main']
    paths: ['version.py']
    tags: ['v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and verify portable bundle
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if (-not $version) { $version = python -c 'from version import VERSION; print(VERSION)' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          python -m pip install -r requirements-lock.txt
          python scripts/build_translations.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Translation catalog failed' }
          Get-ChildItem ui -Filter *.js -Recurse | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "UI syntax failed: $($_.Name)" } }
          Get-ChildItem tests -Filter test_*.js | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed: $($_.Name)" }
          }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python scripts/build_portable.py --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $bundle = "build/portable-$version/AFTERPLAY Portable"
          & "$bundle/app/runtime/python.exe" -c 'import av, windows_capture, pyaudiowpatch, webview; print("Portable imports OK")'
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime failed' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Upload application binaries for verified signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: afterplay-unsigned-binaries
          if-no-files-found: error
          path: |
            build/portable-${{ env.RELEASE_VERSION }}/AFTERPLAY Portable/AFTERPLAY.exe
            build/portable-${{ env.RELEASE_VERSION }}/AFTERPLAY Portable/app/Updater.exe
            build/portable-${{ env.RELEASE_VERSION }}/AFTERPLAY Portable/app/ProcessAudio.dll
            build/portable-${{ env.RELEASE_VERSION }}/AFTERPLAY Portable/app/ReplayNotification.dll
      - name: Request SignPath signature and wait for maintainer approval
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed
          parameters: |
            version: "${{ env.RELEASE_VERSION }}.0"
      - name: Verify signed files and regenerate portable checksums
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $bundle = "build/portable-$env:RELEASE_VERSION/AFTERPLAY Portable"
          foreach ($name in @('AFTERPLAY.exe','Updater.exe','ProcessAudio.dll','ReplayNotification.dll')) {
            $relative = if ($name -eq 'AFTERPLAY.exe') { $name } else { 'app/' + $name }
            $file = Join-Path 'build/signed' $relative
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $name" }
            Copy-Item -LiteralPath $file -Destination (Join-Path $bundle $relative)
          }
          python scripts/repackage_portable.py --bundle $bundle --output dist --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Signed bundle verification failed' }
      - name: Publish ZIP and SHA-256
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist/*.zip, dist/*.sha256 | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "AFTERPLAY $env:RELEASE_TAG" --notes-file docs/RELEASE.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

