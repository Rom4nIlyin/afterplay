name: Tests
on:
  push:
    branches-ignore: ['main']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Translations, UI syntax and tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-lock.txt
          python scripts/build_translations.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Translation catalog failed' }
          Get-ChildItem src/ui -Filter *.js -Recurse | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "UI syntax failed: $($_.Name)" } }
          Get-ChildItem tests -Filter test_*.js | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed: $($_.Name)" }
          }
          python -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
