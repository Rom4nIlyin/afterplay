<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="AFTERPLAY — сохрани момент, который уже случился">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#131519"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sel" x1="0" x2="1">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="frames" width="64" height="76" patternUnits="userSpaceOnUse">
      <rect x="3" y="0" width="58" height="76" rx="6" fill="#1B1E24"/>
      <rect x="3" y="0" width="58" height="76" rx="6" fill="none" stroke="#262A31"/>
    </pattern>
  </defs>

  <rect width="1600" height="440" rx="28" fill="url(#bg)"/>
  <ellipse cx="1180" cy="230" rx="430" ry="230" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1599" height="439" rx="27.5" fill="none" stroke="#262A31"/>

  <!-- Wordmark -->
  <g font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif">
    <circle cx="112" cy="146" r="11" fill="#FF8A3D"/>
    <circle cx="112" cy="146" r="22" fill="none" stroke="#FF8A3D" stroke-opacity=".35" stroke-width="2"/>
    <text x="148" y="166" fill="#F2F3F5" font-size="62" font-weight="700" letter-spacing="6">AFTERPLAY</text>
    <text x="96" y="238" fill="#F2F3F5" font-size="34" font-weight="600">Сохрани момент, который уже случился.</text>
    <text x="96" y="284" fill="#A3A9B4" font-size="23">Мгновенный повтор, запись экрана, обрезка и экспорт</text>
    <text x="96" y="316" fill="#A3A9B4" font-size="23">для Windows — в одном портативном приложении.</text>
    <g font-size="17" font-weight="600">
      <rect x="96" y="352" width="128" height="36" rx="18" fill="#1B1E24" stroke="#363B44"/>
      <text x="160" y="376" fill="#C4C9D1" text-anchor="middle">Windows x64</text>
      <rect x="236" y="352" width="150" height="36" rx="18" fill="#1B1E24" stroke="#363B44"/>
      <text x="311" y="376" fill="#C4C9D1" text-anchor="middle">NVENC · H.264</text>
      <rect x="398" y="352" width="148" height="36" rx="18" fill="#1B1E24" stroke="#363B44"/>
      <text x="472" y="376" fill="#C4C9D1" text-anchor="middle">RU · EN · 한국어</text>
    </g>
  </g>

  <!-- Replay timeline: frames, a selected clip, a marker and the playhead -->
  <g transform="translate(860 118)">
    <rect width="620" height="204" rx="20" fill="#131519" stroke="#262A31"/>
    <g font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="600">
      <circle cx="32" cy="34" r="7" fill="#FF4D4F"/>
      <text x="48" y="40" fill="#F2F3F5">ПОВТОР</text>
      <text x="124" y="40" fill="#6B7280">· последние 5 мин</text>
      <rect x="474" y="18" width="122" height="32" rx="16" fill="#FF8A3D"/>
      <text x="535" y="40" fill="#0B0C0F" text-anchor="middle">Сохранить</text>
    </g>
    <rect x="24" y="74" width="572" height="76" fill="url(#frames)"/>
    <rect x="24" y="74" width="214" height="76" fill="#0B0C0F" fill-opacity=".62"/>
    <rect x="430" y="74" width="166" height="76" fill="#0B0C0F" fill-opacity=".62"/>
    <rect x="238" y="74" width="192" height="76" fill="url(#sel)"/>
    <rect x="238" y="72" width="192" height="80" rx="4" fill="none" stroke="#FF8A3D" stroke-width="3"/>
    <rect x="231" y="88" width="10" height="48" rx="5" fill="#FF8A3D"/>
    <rect x="427" y="88" width="10" height="48" rx="5" fill="#FF8A3D"/>
    <path d="M316 62 l7 -12 l7 12 z" fill="#FF8A3D"/>
    <line x1="352" y1="64" x2="352" y2="162" stroke="#F2F3F5" stroke-width="3"/>
    <circle cx="352" cy="64" r="7" fill="#F2F3F5"/>
    <g font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="15" fill="#A3A9B4">
      <text x="24" y="184">03:12</text>
      <text x="238" y="184" fill="#FF8A3D">отрезок · 00:24</text>
      <text x="596" y="184" text-anchor="end">05:00</text>
    </g>
  </g>
</svg>
